{% extends 'base.html' %}
{% block content %}
<h3>{{ 'Edit' if slot else 'Create' }} Slot - {{ exam.name }}</h3>
<p class="text-muted">Slot date has to be after booking ends ({{ exam.booking_end }}).</p>
<form method="POST" class="card card-body" style="max-width:450px">
    <label class="form-label">Date</label>
    <input type="date" name="date" class="form-control mb-2" value="{{ slot.date if slot }}" required>
    <label class="form-label">Start Time</label>
    <input type="time" name="start_time" class="form-control mb-2" value="{{ slot.start_time if slot }}" required>
    <label class="form-label">End Time</label>
    <input type="time" name="end_time" class="form-control mb-2" value="{{ slot.end_time if slot }}" required>
    <label class="form-label">Max Students</label>
    <input type="number" min="1" name="capacity" class="form-control mb-3" value="{{ slot.capacity if slot }}" required>
    <button class="btn btn-primary">Save</button>
</form>
{% endblock %}
