{# Examiner: Evaluate page #}
{% extends 'base.html' %}
{% block content %}
<h3>Evaluate {{ b.student.name }}</h3>
<p>{{ b.exam.name }} (Max {{ b.exam.max_marks }})</p>
<form method="POST" class="card card-body" style="max-width:600px">
    {% for r in rubrics %}
    <div class="mb-2">
        <label class="form-label">{{ r.criterion }} <small class="text-muted">(out of {{ r.max_marks }}, weight {{ r.weightage }}%)</small></label>
        {% if r.description %}<div class="small text-muted">{{ r.description }}</div>{% endif %}
        <input type="number" step="0.5" min="0" max="{{ r.max_marks }}" name="r_{{ r.id }}"
               class="form-control" value="{{ old.get(r.id, '') }}" required>
    </div>
    {% endfor %}
    <label class="form-label">Remarks</label>
    <textarea name="remarks" class="form-control mb-3">{{ ev.remarks if ev }}</textarea>
    <button class="btn btn-success">Submit Marks</button>
</form>
{% endblock %}
