{% extends 'base.html' %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="card auth-card">
    <div class="card-body">
        <h4 class="mb-3">Register</h4>
        <form method="POST">
            <div class="mb-2">
                <label class="form-label">Register as</label>
                <select name="role" class="form-select">
                    <option value="student">Student</option>
                    <option value="examiner">Examiner</option>
                </select>
            </div>
            <div class="mb-2">
                <label class="form-label">Full Name</label>
                <input name="name" class="form-control" required>
            </div>
            <div class="mb-2">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="mb-2">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" minlength="4" required>
            </div>
            <div class="mb-2">
                <label class="form-label">Phone</label>
                <input name="phone" class="form-control">
            </div>
            <!-- no JS so both fields are shown, only the relevant one is saved -->
            <div class="mb-2">
                <label class="form-label">Roll No <small class="text-muted">(students)</small></label>
                <input name="roll_no" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">Department <small class="text-muted">(examiners)</small></label>
                <input name="department" class="form-control">
            </div>
            <button class="btn btn-success w-100">Register</button>
        </form>
        <p class="mt-3 mb-0 text-center">Already registered? <a href="{{ url_for('login') }}">Login</a></p>
    </div>
</div>
{% endblock %}
