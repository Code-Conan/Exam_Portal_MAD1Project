{# Admin: Summary page #}
{% extends 'base.html' %}
{% block title %}Summary{% endblock %}
{% block content %}
<h3 class="mb-3">Summary</h3>
<div class="row g-3">
    <div class="col-md-6">
        <img class="img-fluid bg-white p-2 rounded" alt="Booking trend"
             src="{{ url_for('static', filename='charts/trend.png') }}?t={{ t }}">
    </div>
    <div class="col-md-6">
        <img class="img-fluid bg-white p-2 rounded" alt="Examiner workload"
             src="{{ url_for('static', filename='charts/workload.png') }}?t={{ t }}">
    </div>
    <div class="col-md-6">
        <img class="img-fluid bg-white p-2 rounded" alt="Examination completion"
             src="{{ url_for('static', filename='charts/completion.png') }}?t={{ t }}">
    </div>
</div>
{% endblock %}
