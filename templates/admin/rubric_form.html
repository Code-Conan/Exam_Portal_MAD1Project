{% extends 'base.html' %}
{% block content %}
<h3>Edit Rubric - {{ r.exam.name }}</h3>
<form method="POST" class="card card-body" style="max-width:500px">
    <label class="form-label">Criterion</label>
    <input name="criterion" class="form-control mb-2" value="{{ r.criterion }}" required>
    <label class="form-label">Max Marks</label>
    <input type="number" min="1" name="max_marks" class="form-control mb-2" value="{{ r.max_marks }}" required>
    <label class="form-label">Weightage (%)</label>
    <input type="number" min="0" max="100" name="weightage" class="form-control mb-2" value="{{ r.weightage }}">
    <label class="form-label">Description</label>
    <textarea name="description" class="form-control mb-3">{{ r.description }}</textarea>
    <button class="btn btn-primary">Save</button>
</form>
{% endblock %}
