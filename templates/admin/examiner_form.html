{% extends 'base.html' %}
{% block content %}
<h3>Add Examiner</h3>
<form method="POST" class="card card-body" style="max-width:500px">
    <label class="form-label">Name</label>
    <input name="name" class="form-control mb-2" required>
    <label class="form-label">Email</label>
    <input type="email" name="email" class="form-control mb-2" required>
    <label class="form-label">Password</label>
    <input type="password" name="password" minlength="4" class="form-control mb-2" required>
    <label class="form-label">Phone</label>
    <input name="phone" class="form-control mb-2">
    <label class="form-label">Department</label>
    <input name="department" class="form-control mb-3">
    <button class="btn btn-primary">Add</button>
</form>
{% endblock %}
